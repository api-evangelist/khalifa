x-coverage:
  state: covered
  reason: covered
  detail: >-
    Khalifa University publishes no developer portal and no API program, but it is not empty. Two
    institution-operated machine-readable surfaces were found and verified live on 2026-09-01: an
    open OAI-PMH 2.0 endpoint at khazna.ku.ac.ae/ws/oai (Identify, ListMetadataFormats and ListSets
    all HTTP 200, adminEmail khazna@ku.ac.ae) and the university's own Microsoft Entra ID tenant
    for ku.ac.ae (OIDC discovery and SAML federation metadata both HTTP 200, tenant
    08fe1c0a-19f5-4f24-a662-fdd5dd460025, in production for elearn/portal/kubee SSO). A third,
    partial surface is the WordPress REST API on www.ku.ac.ae, whose discovery root and a handful
    of routes are public while core collections return 401. Six vendor tenancies were identified
    and recorded as relationships rather than contracts: Elsevier Pure (Khazna), Blackboard Learn,
    Ex Libris Primo VE, Springshare LibGuides/LibCal/LibAnswers, and OCLC EZproxy. Elsevier's
    "Pure API" spec, served from Khalifa's own host at khazna.ku.ac.ae/ws/api/openapi.yaml with a
    relative servers block and pure-support@elsevier.com as contact, was found and deliberately
    NOT catalogued. Two apparent Figshare tenancies were rejected as false positives: both
    khalifa.figshare.com and ku.figshare.com return HTTP 202, and so does a control request to a
    nonsense subdomain — Figshare wildcards every subdomain. ku.elsevierpure.com was also rejected:
    it redirects to researchprofiles.ku.dk, which is the University of Copenhagen. No DataCite
    client, no Crossref membership, no Shibboleth IdP, no eduGAIN entity, no open-data portal
    (data.ku.ac.ae, opendata.ku.ac.ae do not resolve), and no course-catalog or registrar API
    (api., developer., sis., registration., catalog.ku.ac.ae all fail to resolve) were found. The
    HPC portal at hpc.ku.ac.ae resolves but returned HTTP 503 "Server Unavailable", so no pointer
    is emitted for it.
