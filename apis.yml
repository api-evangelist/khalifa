aid: khalifa
name: Khalifa University
x-type: university
x-category: Public Research University
description: >-
  Khalifa University of Science and Technology is a research-intensive public university in Abu
  Dhabi, United Arab Emirates (ROR 05hffr360), formed from the 2017 merger of KUSTAR, the Masdar
  Institute and the Petroleum Institute. Its programmable footprint is small, real, and almost
  entirely indirect. Two surfaces are genuinely institution-operated: an OAI-PMH 2.0 endpoint for
  the Khazna research portal at khazna.ku.ac.ae/ws/oai, live and anonymous with an institution
  admin contact, and the university's own Microsoft Entra ID tenant for the ku.ac.ae namespace,
  which issues OpenID Connect and SAML 2.0 for institution systems. A third, partial surface is the
  WordPress REST API on www.ku.ac.ae, whose discovery root and a handful of routes answer publicly
  while the core collections are closed with HTTP 401. Everything else a search turns up is a
  vendor contract running under the university's name: Khazna itself is an Elsevier Pure tenant
  (khazna.ku.ac.ae CNAMEs to khalifauniversity.elsevierpure.com) and Elsevier's own Pure API spec
  is served from that host; the LMS is a Blackboard Learn tenant behind elearn.ku.ac.ae; discovery
  is Ex Libris Primo VE; the library web presence, calendar and ask-a-librarian service are
  Springshare; off-campus access is OCLC EZproxy. Those relationships are recorded here as
  tenancies. None of their contracts are catalogued as Khalifa's. There is no central developer
  portal, no published API program, no open-data portal, and no institution-operated API reference.
