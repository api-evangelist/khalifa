  x-operator: registry
  description: >-
    Khalifa University of Science and Technology is registered in the Research Organization Registry as
    https://ror.org/05hffr360, with the alternate names KUSTAR and Khalifa University and country United
    Arab Emirates. This is a membership in an identifier registry the institution is registered in, not
    a contract it operates: the registry's own API belongs to ROR. Recorded because it is a fact about
    Khalifa, and it is the identifier every downstream research system resolves them by. No DataCite client
    or provider (api.datacite.org, meta.total 0) and no Crossref membership (api.crossref.org/members)
