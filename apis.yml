- aid: khalifa:entra-identity-federation
  name: Khalifa University Identity Federation (Microsoft Entra ID)
  x-operator: federation
  description: >-
    Khalifa University operates its own Microsoft Entra ID tenant for the ku.ac.ae namespace — tenant
    id 08fe1c0a-19f5-4f24-a662-fdd5dd460025, getuserrealm.srf reporting NameSpaceType=Managed, DomainName=ku.ac.ae,
    FederationBrandName=ku.ac.ae. The OpenID Connect discovery document and the SAML 2.0 federation metadata
    are both public and machine-readable (HTTP 200, probed 2026-09-01). The tenant is demonstrably the
    production IdP for institution systems: elearn.ku.ac.ae redirects to its /saml2 endpoint with a SAMLRequest,
    and portal.ku.ac.ae and kubee.ku.ac.ae redirect to its WS-Federation endpoint with wtrealm http://adfs.ku.ac.ae/adfs/services/trust.
