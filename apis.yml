- aid: khalifa:khazna-pure
  name: Khazna Research Portal (Elsevier Pure tenant)
  x-operator: tenant
  description: >-
    Khalifa University's CRIS and research portal, Khazna, is an Elsevier Pure tenancy: khazna.ku.ac.ae
    is a CNAME to khalifauniversity.elsevierpure.com, which is a CNAME to eu.prod.elsevierpure.com. The
    research outputs, the profiles and the DOIs are Khalifa's; the software and the contract are Elsevier's.
    The Pure Web Service spec served at https://khazna.ku.ac.ae/ws/api/openapi.yaml — info.title "Pure
    API", version 5.36.2-1, info.contact.email pure-support@elsevier.com, servers "- url: /ws/api" (relative,
    hostless) — is DELIBERATELY NOT SAVED under this institution. It is the exact class of misattribution
    this catalog's university pipeline exists to prevent. The relationship is the fact worth recording;
    the contract belongs with Elsevier.
