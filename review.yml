reviews:
  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-profiled under the API Evangelist university pipeline, with operator attribution settled
      before anything was saved. Khalifa University still publishes no developer portal and no API
      program, but the 2026-06-03 review's conclusion that there is no machine-readable surface at
      all was wrong. Two institution-operated surfaces were found and verified live: an open
      OAI-PMH 2.0 endpoint for the Khazna research portal at khazna.ku.ac.ae/ws/oai (adminEmail
      khazna@ku.ac.ae, OpenAIRE CERIF 1.2 profile, 7 metadata formats), and the university's own
      Microsoft Entra ID tenant for ku.ac.ae, whose OIDC discovery and SAML 2.0 federation metadata
      are public and which is in production as the SSO IdP for elearn, portal and kubee. The
      WordPress REST API on www.ku.ac.ae is a third, partial surface — discovery root and a few
      routes public, core collections 401. Six vendor tenancies were identified and recorded as
      relationships rather than contracts. Elsevier's "Pure API" specification, served from
      Khalifa's own hostname at khazna.ku.ac.ae/ws/api/openapi.yaml, was found and deliberately
      not catalogued as Khalifa's. Two apparent Figshare tenancies were rejected as wildcard
      false positives. No endpoints were fabricated; only URLs probed live are listed below.
    endpoints:
      - url: https://khazna.ku.ac.ae/ws/oai?verb=Identify
        status: 200
        note: >-
          Institution-operated OAI-PMH 2.0 base URL on ku.ac.ae. Identify returns adminEmail
          khazna@ku.ac.ae, earliestDatestamp 2023-01-11T09:41:56Z. ListMetadataFormats 200 (7
          formats), ListSets 200.
      - url: https://khazna.ku.ac.ae/ws/api/openapi.yaml
        status: 200
        note: >-
          Elsevier Pure API 5.36.2-1, contact pure-support@elsevier.com, servers "- url: /ws/api"
          (relative). Vendor contract on the institution's host. NOT catalogued as Khalifa's.
      - url: https://login.microsoftonline.com/ku.ac.ae/v2.0/.well-known/openid-configuration
        status: 200
        note: >-
          Khalifa's own Entra ID tenant 08fe1c0a-19f5-4f24-a662-fdd5dd460025 for the ku.ac.ae
          namespace; getuserrealm reports NameSpaceType=Managed, FederationBrandName=ku.ac.ae.
      - url: https://login.microsoftonline.com/ku.ac.ae/federationmetadata/2007-06/federationmetadata.xml
