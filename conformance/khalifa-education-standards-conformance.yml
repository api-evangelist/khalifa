standards:
- id: oai-pmh
  status: conformant
  operator: institution
  evidence:
    url: https://khazna.ku.ac.ae/ws/oai?verb=Identify
    status: 200
    content_type: application/xml
    detail: >-
      Khazna, Khalifa University's research portal, answers OAI-PMH 2.0 at
      https://khazna.ku.ac.ae/ws/oai. Identify returns protocolVersion 2.0, baseURL
      https://khazna.ku.ac.ae/ws/oai, adminEmail khazna@ku.ac.ae, earliestDatestamp
      2023-01-11T09:41:56Z, granularity YYYY-MM-DDThh:mm:ssZ, deletedRecord no. The response
      declares the OpenAIRE CERIF 1.2 profile in xsi:schemaLocation. ListMetadataFormats returns
      7 formats including oai_dc, mods (LoC MODS 3.8) and xmetadiss; ListSets returns HTTP 200
      with a 23,615-byte set hierarchy. The base URL is on the institution's own registrable
      domain and the admin contact is an institution address, so the harvesting surface is
      recorded as institution-operated even though the repository software is an Elsevier Pure
      tenant. Captured verbatim in examples/khalifa-oai-pmh-identify-response.xml and
      examples/khalifa-oai-pmh-listmetadataformats-response.xml.
- id: saml
  status: conformant
  operator: institution
  evidence:
    url: https://login.microsoftonline.com/ku.ac.ae/federationmetadata/2007-06/federationmetadata.xml
    status: 200
    content_type: application/xml
    detail: >-
      Khalifa University operates its own Microsoft Entra ID tenant for the ku.ac.ae namespace
      (tenant id 08fe1c0a-19f5-4f24-a662-fdd5dd460025; getuserrealm.srf reports
      NameSpaceType=Managed, DomainName=ku.ac.ae, FederationBrandName=ku.ac.ae). SAML 2.0
      federation metadata for that tenant is published and returns HTTP 200. The tenant is
      demonstrably in production as a SAML IdP: https://elearn.ku.ac.ae/ (Blackboard Learn)
      redirects to
      https://login.microsoftonline.com/08fe1c0a-19f5-4f24-a662-fdd5dd460025/saml2 with a
      SAMLRequest, and https://portal.ku.ac.ae/ and https://kubee.ku.ac.ae/ redirect to the same
      tenant's WS-Federation endpoint with wtrealm
      http://adfs.ku.ac.ae/adfs/services/trust. The identity provider is the institution's; the
      hosting platform is Microsoft's.
